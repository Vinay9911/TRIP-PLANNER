[project]
name = "trip-planner-agent"
version = "0.1.0"
description = "An intelligent travel-planning AI agent with tool use, layered memory, and multi-hop RAG."
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    # --- Web framework ---------------------------------------------------
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "python-multipart>=0.0.20",

    # --- Configuration & validation --------------------------------------
    "pydantic>=2.11",
    "pydantic-settings>=2.11",

    # --- Agent framework -------------------------------------------------
    # LangGraph is the orchestration layer; LangChain supplies the model
    # adapters and the `create_agent` tool-calling harness used by the
    # executor node. See docs/adr/0001-agent-framework.md.
    "langchain>=1.3,<2",
    "langchain-core>=1.4,<2",
    "langgraph>=1.2,<2",
    "langchain-groq>=1.0",
    "langgraph-checkpoint-postgres>=3.0",

    # --- Data / persistence ----------------------------------------------
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.4",

    # --- External services ------------------------------------------------
    "httpx>=0.28",
    "google-genai>=1.0",
    "tenacity>=9.1",

    # --- Auth -------------------------------------------------------------
    "pyjwt[crypto]>=2.10",

    # --- Observability ----------------------------------------------------
    "structlog>=25.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=6.2",
    "respx>=0.22",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations - enforces the "type hints throughout" bar
    "D",    # pydocstyle        - enforces the "docstrings throughout" bar
    "BLE",  # flake8-blind-except - every bare `except Exception` must justify itself
    "S",    # flake8-bandit     - security smells (hardcoded secrets, unsafe calls)
    "RUF",
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "ANN401" # allow `Any` where a tool boundary genuinely needs it
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixed ports and fake credentials by design.
"tests/*" = ["D103", "D100", "ANN201", "ANN001", "S101", "S105", "S106", "S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require live external services (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
